name: team-platform

services:
  postgres:
    image: postgres:18-alpine
    container_name: team-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DEFAULT_DB}

      TEAM_KEYCLOAK_DB_USERNAME: ${TEAM_KEYCLOAK_DB_USERNAME}
      TEAM_KEYCLOAK_DB_PASSWORD: ${TEAM_KEYCLOAK_DB_PASSWORD}
      TEAM_KEYCLOAK_DB: ${TEAM_KEYCLOAK_DB}

      TEAM_ORGANIZATION_DB_USERNAME: ${TEAM_ORGANIZATION_DB_USERNAME}
      TEAM_ORGANIZATION_DB_PASSWORD: ${TEAM_ORGANIZATION_DB_PASSWORD}
      TEAM_ORGANIZATION_DB: ${TEAM_ORGANIZATION_DB}

      TEAM_TICKETS_DB_USERNAME: ${TEAM_TICKETS_DB_USERNAME}
      TEAM_TICKETS_DB_PASSWORD: ${TEAM_TICKETS_DB_PASSWORD}
      TEAM_TICKETS_DB: ${TEAM_TICKETS_DB}

      TEAM_DOCUMENTS_DB_USERNAME: ${TEAM_DOCUMENTS_DB_USERNAME}
      TEAM_DOCUMENTS_DB_PASSWORD: ${TEAM_DOCUMENTS_DB_PASSWORD}
      TEAM_DOCUMENTS_DB: ${TEAM_DOCUMENTS_DB}

      TEAM_CHATS_DB_USERNAME: ${TEAM_CHATS_DB_USERNAME}
      TEAM_CHATS_DB_PASSWORD: ${TEAM_CHATS_DB_PASSWORD}
      TEAM_CHATS_DB: ${TEAM_CHATS_DB}

      TEAM_IT_SERVICES_DB_USERNAME: ${TEAM_IT_SERVICES_DB_USERNAME}
      TEAM_IT_SERVICES_DB_PASSWORD: ${TEAM_IT_SERVICES_DB_PASSWORD}
      TEAM_IT_SERVICES_DB: ${TEAM_IT_SERVICES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DEFAULT_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - team-network

  redis:
    image: redis:8-alpine
    container_name: team-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD}",
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - team-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: team-keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KC_DB: ${KC_DB}
      KC_DB_URL_HOST: ${KC_DB_URL_HOST}
      KC_DB_URL_PORT: ${KC_DB_URL_PORT}
      KC_DB_URL_DATABASE: ${TEAM_KEYCLOAK_DB}
      KC_DB_USERNAME: ${TEAM_KEYCLOAK_DB_USERNAME}
      KC_DB_PASSWORD: ${TEAM_KEYCLOAK_DB_PASSWORD}

      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded

      KC_HEALTH_ENABLED: "true"

      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - team-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '200 OK' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  team-tickets-api:
    build:
      context: ../../team-tickets/backend
      dockerfile: Dockerfile
    container_name: team-tickets-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - team-network
    profiles:
      - team-tickets
      - full

  team-tickets-web:
    build:
      context: ../../team-tickets/frontend
      dockerfile: Dockerfile
    container_name: team-tickets-web
    restart: unless-stopped
    depends_on:
      - team-tickets-api
    networks:
      - team-network
    profiles:
      - team-tickets
      - full

  team-documents-api:
    build:
      context: ../../team-documents/backend
      dockerfile: Dockerfile
    container_name: team-documents-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - team-network
    profiles:
      - team-documents
      - full

  team-documents-web:
    build:
      context: ../../team-documents/frontend
      dockerfile: Dockerfile
    container_name: team-documents-web
    restart: unless-stopped
    depends_on:
      - team-documents-api
    networks:
      - team-network
    profiles:
      - team-documents
      - full

volumes:
  postgres_data:
  redis_data:

networks:
  team-network:
    driver: bridge
