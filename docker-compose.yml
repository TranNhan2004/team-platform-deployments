name: team-platform

services:
  postgres:
    image: postgres:18-alpine
    container_name: team-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DEFAULT_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DEFAULT_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - team-network

  redis:
    image: redis:8-alpine
    container_name: team-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD}",
      ]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - team-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: team-keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}

      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "${KEYCLOAK_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - team-network

  team-tickets-api:
    build:
      context: ../team-tickets/backend
      dockerfile: Dockerfile
    container_name: team-tickets-api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV}
      APP_PORT: 8080

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${TICKETS_DB_NAME}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
    ports:
      - "${TICKETS_API_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - team-network
    profiles:
      - test-tt
      - prod-tt

  team-tickets-web:
    build:
      context: ../team-tickets/frontend
      dockerfile: Dockerfile
    container_name: team-tickets-web
    restart: unless-stopped
    environment:
      API_BASE_URL: ${TICKETS_PUBLIC_API_BASE_URL}
      KEYCLOAK_BASE_URL: ${KEYCLOAK_PUBLIC_BASE_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${TICKETS_KEYCLOAK_CLIENT_ID}
    ports:
      - "${TICKETS_WEB_PORT}:80"
    depends_on:
      - team-tickets-api
    networks:
      - team-network
    profiles:
      - test-tt
      - prod-tt

  team-documents-api:
    build:
      context: ../team-documents/backend
      dockerfile: Dockerfile
    container_name: team-documents-api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV}
      APP_PORT: 8080

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DOCUMENTS_DB_NAME}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}

      TICKETS_API_BASE_URL: http://team-tickets-api:8080
    ports:
      - "${DOCUMENTS_API_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
      team-tickets-api:
        condition: service_started
    networks:
      - team-network
    profiles:
      - test-tt
      - prod-tt

  team-documents-web:
    build:
      context: ../team-documents/frontend
      dockerfile: Dockerfile
    container_name: team-documents-web
    restart: unless-stopped
    environment:
      API_BASE_URL: ${DOCUMENTS_PUBLIC_API_BASE_URL}
      KEYCLOAK_BASE_URL: ${KEYCLOAK_PUBLIC_BASE_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${DOCUMENTS_KEYCLOAK_CLIENT_ID}
    ports:
      - "${DOCUMENTS_WEB_PORT}:80"
    depends_on:
      - team-documents-api
    networks:
      - team-network
    profiles:
      - test-tt
      - prod-tt

volumes:
  postgres_data:
  redis_data:

networks:
  team-network:
    driver: bridge
